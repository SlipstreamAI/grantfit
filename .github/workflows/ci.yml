name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Postgres 16 and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib postgresql-16-pgtap pgtap
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"

      - name: SQL tests
        run: ./scripts/test_sql.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tests
        env:
          GRANTFIT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/grantfit_test
        run: |
          python -m pip install -e "./worker[dev]"
          pytest worker/tests -q

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge function tests
        run: deno test --allow-read supabase/functions
