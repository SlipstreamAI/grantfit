[project]
name = "grantfit"
version = "1.0.0"
description = "Sync Grants.gov notices into Postgres with budgets, conditional requests, and idempotent upserts."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grantfit = "grantfit.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
